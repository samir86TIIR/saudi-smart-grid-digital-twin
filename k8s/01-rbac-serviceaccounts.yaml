apiVersion: v1
kind: ServiceAccount
metadata:
  name: flink-serviceaccount
  namespace: smart-grid
  annotations:
    iam.gke.io/gcp-service-account: sa-flink-streamer@ksa-smartgrid-prod.iam.gserviceaccount.com
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: simulator-serviceaccount
  namespace: smart-grid
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: flink-jobmanager-role
  namespace: smart-grid
rules:
  - apiGroups: [""]
    resources: ["pods", "services", "configmaps"]
    verbs: ["get", "list", "watch", "create", "delete", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: flink-jobmanager-binding
  namespace: smart-grid
subjects:
  - kind: ServiceAccount
    name: flink-serviceaccount
    namespace: smart-grid
roleRef:
  kind: Role
  name: flink-jobmanager-role
  apiGroup: rbac.authorization.k8s.io
