networks:
  smartgrid-net:
    driver: bridge

services:
  # -------------------------------------------------------------
  # Apache Kafka (KRaft mode - No Zookeeper needed)
  # -------------------------------------------------------------
  kafka:
    image: apache/kafka:4.4.0
    container_name: smartgrid-kafka
    networks:
      - smartgrid-net
    ports:
      - "9092:9092"
      - "9093:9093"
    environment:
      - CLUSTER_ID=4L622nShTUiBenDuAapnsG
      - KAFKA_NODE_ID=1
      - KAFKA_PROCESS_ROLES=broker,controller
      - KAFKA_LISTENERS=PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      - KAFKA_INTER_BROKER_LISTENER_NAME=PLAINTEXT
      - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_CONTROLLER_QUORUM_VOTERS=1@kafka:9093
      - KAFKA_AUTO_CREATE_TOPICS_ENABLE=true
      - KAFKA_DEFAULT_REPLICATION_FACTOR=1
      - KAFKA_NUM_PARTITIONS=6
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_MIN_ISR=1
      - KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS=0
    healthcheck:
      test: ["CMD-SHELL", "if command -v nc >/dev/null 2>&1; then nc -z 127.0.0.1 9092; else /opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1; fi"]
      interval: 10s
      timeout: 20s
      retries: 10
      start_period: 20s

  # -------------------------------------------------------------
  # IoT Smart Meter Simulator (KAPSARC-calibrated)
  # -------------------------------------------------------------
  data-simulator:
    build:
      context: ./data_simulator
      dockerfile: Dockerfile
    container_name: smartgrid-simulator
    networks:
      - smartgrid-net
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - KAFKA_TOPIC=smartmeter.telemetry
    command: ["--rate", "3000", "--duration", "0", "--bootstrap-servers", "kafka:29092"]

  # -------------------------------------------------------------
  # Apache Flink JobManager (Web UI on http://localhost:8081)
  # -------------------------------------------------------------
  flink-jobmanager:
    image: apache/flink:1.18.1-scala_2.12-java11
    container_name: smartgrid-flink-jobmanager
    networks:
      - smartgrid-net
    ports:
      - "8081:8081"
    command: jobmanager
    environment:
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: flink-jobmanager
        parallelism.default: 2

  # -------------------------------------------------------------
  # Apache Flink TaskManager
  # -------------------------------------------------------------
  flink-taskmanager:
    image: apache/flink:1.18.1-scala_2.12-java11
    container_name: smartgrid-flink-taskmanager
    networks:
      - smartgrid-net
    depends_on:
      - flink-jobmanager
    command: taskmanager
    environment:
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: flink-jobmanager
        taskmanager.numberOfTaskSlots: 4
        parallelism.default: 2
